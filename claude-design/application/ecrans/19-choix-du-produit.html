<!-- ═══ CHOIX DU PRODUIT ═══ -->
<div style="position:absolute;inset:0;background:var(--papier);color:var(--encre);display:flex;flex-direction:column;transform:{{ pickTf }};transition:transform .4s cubic-bezier(.22,1,.36,1)">
  <div style="height:{{ topPad }};flex:none"></div>
  <div style="display:flex;gap:8px;align-items:center;padding:8px 14px"><div style="flex:1;display:flex;align-items:center;gap:10px;height:48px;border-radius:24px;background:var(--champ);border:1px solid rgba(23,21,18,.14);padding:0 16px"><svg width="18" height="18" stroke="#847966" stroke-width="1.8" aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke-linecap="round" stroke-linejoin="round" data-ico="chercher"><circle cx="11" cy="11" r="8"></circle><path d="m21 21-4.3-4.3"></path></svg><input ref="{{ pRef }}" value="{{ pq }}" onChange="{{ onPq }}" placeholder="Tomate, aloco, gnangnan…" style="flex:1;min-width:0;border:0;background:transparent;font-size:var(--t-lg);outline:none;color:var(--encre)"></div><button onClick="{{ closePick }}" style="height:44px;border:0;background:transparent;font-size:var(--t-lead);padding:0 6px;color:var(--encre)">Annuler</button></div>
  <div style="flex:1;overflow-y:auto;padding:4px 0 40px">
    <sc-for list="{{ pickGroups }}" as="g" hint-placeholder-count="0">
      <div class="lab" style="display:block;padding:14px 20px 6px">{{ g.t }}</div>
      <sc-for list="{{ g.items }}" as="p" hint-placeholder-count="3"><button onClick="{{ p.pick }}" style="width:100%;border:0;background:transparent;display:flex;align-items:center;gap:12px;padding:6px 20px;min-height:52px;text-align:left;color:var(--encre)"><img sc-camel-src="{{ p.thumb }}" alt="" style="width:38px;height:38px;object-fit:{{ p.fit }};border-radius:{{ p.rad }};flex:none"><span style="flex:1;display:flex;flex-direction:column"><span style="font-size:var(--t-lead)">{{ p.name }}</span><span style="font-size:var(--t-sm);color:var(--mute)">{{ p.sub }}</span></span></button></sc-for>
    </sc-for>
  </div>
</div>

<div style="position:absolute;left:50%;bottom:110px;transform:translateX(-50%) translateY({{ toastY }});opacity:{{ toastOp }};transition:transform .32s cubic-bezier(.22,1,.36,1),opacity .2s cubic-bezier(.2,.8,.2,1);background:var(--encre);color:var(--ivoire);border:1px solid rgba(245,240,230,.12);padding:12px 18px;border-radius:22px;font-size:var(--t-base);white-space:nowrap;pointer-events:none;box-shadow:0 10px 30px rgba(0,0,0,.35);z-index:25">{{ toast }}</div>

<sc-if value="{{ framed }}" hint-placeholder-val="{{ true }}">
<div style="position:absolute;left:0;right:0;top:0;height:50px;display:flex;align-items:center;justify-content:space-between;padding:6px 34px 0 40px;color:{{ sbColor }};pointer-events:none;transition:color .3s;z-index:20"><span style="font-size:var(--t-lead);font-weight:600">{{ clock }}</span><span style="position:absolute;left:50%;top:11px;width:124px;height:36px;margin-left:-62px;border-radius:20px;background:#000"></span><span style="display:flex;gap:6px;align-items:center"><svg width="18" height="12" viewBox="0 0 18 12" fill="currentColor"><rect x="0" y="8" width="3" height="4" rx="1"></rect><rect x="5" y="5.5" width="3" height="6.5" rx="1"></rect><rect x="10" y="3" width="3" height="9" rx="1"></rect><rect x="15" y="0" width="3" height="12" rx="1" opacity=".35"></rect></svg><svg width="26" height="13" viewBox="0 0 26 13" fill="none"><rect x=".5" y=".5" width="22" height="12" rx="3.5" stroke="currentColor" opacity=".4"></rect><rect x="2" y="2" width="16" height="9" rx="2" fill="currentColor"></rect></svg></span></div>
<div style="position:absolute;left:50%;bottom:8px;width:134px;height:5px;margin-left:-67px;border-radius:3px;background:{{ sbColor }};opacity:.8;pointer-events:none;z-index:20"></div>
</sc-if>

<div class="spl" style="position:absolute;inset:0;background:{{ splashBg }};color:var(--ivoire);display:flex;flex-direction:column;align-items:center;justify-content:center;opacity:{{ splashOp }};pointer-events:{{ splashPe }};transition:opacity .6s ease;z-index:30">
  <div class="spl-marque">{{ splashMark }}</div>
  <span class="spl-dev">{{ splashTxt }}</span>
  <sc-if value="{{ splBloque }}" hint-placeholder-val="{{ false }}"><button type="button" class="spl-re" onClick="{{ splRe }}">Réessayer</button></sc-if>
</div>

</div>
</div>
</div>
</x-dc>
