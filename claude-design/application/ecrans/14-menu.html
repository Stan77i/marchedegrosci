<!-- ═══ MENU : tiroir à gauche, comme Gmail — le nom en haut, le compte d'abord, puis tout le reste ; glisser vers la gauche pour fermer ═══ -->
<div role="dialog" aria-modal="true" aria-label="Menu" aria-hidden="{{ menuHid }}" class="dr-clair" onPointerDown="{{ dDown }}" onPointerMove="{{ dMove }}" onPointerUp="{{ dUp }}" onPointerCancel="{{ dUp }}" style="position:absolute;left:0;top:0;bottom:0;width:min(86%,340px);display:flex;flex-direction:column;background:#FFFDF8;color:#171512;border-radius:0 28px 28px 0;transform:{{ menuTf }};transition:{{ drTr }};box-shadow:14px 0 44px rgba(16,57,43,.22);touch-action:pan-y;visibility:{{ menuVis }}">
  <div style="height:{{ topPad }};flex:none"></div>
  <div style="display:flex;align-items:center;gap:12px;padding:16px 20px 18px;flex:none;border-bottom:1px solid rgba(23,21,18,.07)"><span class="mq-menu">{{ markEl }}</span></div>
  <div style="flex:1;min-height:0;overflow-y:auto;padding:6px 12px 10px 0;overscroll-behavior:contain">
    <sc-for list="{{ menu }}" as="g" hint-placeholder-count="4">
      <sc-if value="{{ g.sep }}" hint-placeholder-val="{{ true }}"><div style="height:1px;background:rgba(23,21,18,.07);margin:8px 0 8px 70px"></div></sc-if>
      <sc-for list="{{ g.items }}" as="i" hint-placeholder-count="3">
        <button onClick="{{ i.go }}" aria-current="{{ i.cur }}" style="width:100%;border:0;background:{{ i.bg }};color:{{ i.fg }};display:flex;align-items:center;gap:14px;padding:6px 16px 6px 16px;border-radius:0 26px 26px 0;text-align:left;min-height:56px;font-family:Jost,system-ui,sans-serif" style-active="background:rgba(16,57,43,.06)">
          <span class="dr-ico" style="width:40px;height:40px;flex:none;display:flex;align-items:center;justify-content:center">{{ i.ico }}</span>
          <span style="flex:1;min-width:0;display:flex;flex-direction:column;gap:2px"><span style="font-size:var(--t-lg);font-weight:500;line-height:1.2">{{ i.t }}</span><sc-if value="{{ i.hasS }}" hint-placeholder-val="{{ false }}"><span style="font-size:var(--t-sm);color:var(--dr-s,#655C4D);line-height:1.3">{{ i.s }}</span></sc-if></span>
          <sc-if value="{{ i.hasN }}" hint-placeholder-val="{{ false }}"><span style="flex:none;min-width:24px;height:22px;padding:0 8px;border-radius:11px;background:{{ i.nBg }};color:{{ i.nFg }};font-size:var(--t-sm);font-weight:600;line-height:22px;text-align:center">{{ i.n }}</span></sc-if>
        </button>
      </sc-for>
    </sc-for>
  </div>
  <div style="flex:none;padding:6px 12px {{ botPad }} 0;border-top:1px solid rgba(23,21,18,.07)"><button onClick="{{ goPorte }}" style="width:100%;border:0;background:transparent;color:#A4472C;display:flex;align-items:center;gap:14px;padding:6px 16px 6px 16px;border-radius:0 26px 26px 0;text-align:left;min-height:56px;font-family:Jost,system-ui,sans-serif;font-size:var(--t-lg);font-weight:500" style-active="background:rgba(242,194,48,.12)"><span aria-hidden="true" style="width:40px;height:40px;flex:none;display:flex;align-items:center;justify-content:center">{{ porteEl }}</span>{{ porteTxt }}</button></div>
</div>
