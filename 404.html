<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#171512">
<meta name="robots" content="noindex">
<title>Page introuvable · Marché de Gros CI</title>
<!-- Page 404 de GitHub Pages : elle vaut pour toutes les adresses du dépôt (application, ancien site, site/).
     L'adresse peut être profonde (/marchedegrosci/site/produits/x/) : la base absolue garde les liens justes. -->
<base href="/marchedegrosci/">
<link rel="icon" type="image/svg+xml" href="icons/v2/favicon.svg">
<link rel="stylesheet" href="css/fonts.css">
<style>
:root{--fond:#171512;--creme:#F3EFE4;--sable:#B9AD98;--mais:#F2C230}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;background:var(--fond);color:var(--creme);font-family:Jost,system-ui,sans-serif}
body{min-height:100vh;min-height:100dvh;display:flex;align-items:center;justify-content:center;padding:24px 16px;
  background:radial-gradient(90% 60% at 50% 0%,rgba(242,194,48,.12),transparent 60%),radial-gradient(70% 50% at 50% 100%,rgba(16,57,43,.55),transparent 70%),var(--fond)}
main{width:100%;max-width:480px;text-align:center}
.logo{font:700 26px/1.05 Jost,sans-serif;letter-spacing:-.02em;margin:0 0 28px}.logo span{color:var(--mais)}
h1{margin:0 0 12px;font:800 clamp(28px,6.4vw,38px)/1.12 Jost,sans-serif;letter-spacing:-.02em;text-wrap:balance}
p{margin:0 auto;max-width:420px;font:400 17px/1.5 Jost,sans-serif;color:var(--sable);text-wrap:pretty}
.go{display:inline-flex;align-items:center;justify-content:center;margin:28px 0 0;min-height:56px;padding:0 30px;border-radius:28px;background:var(--mais);color:#171512;font:700 18px Jost,sans-serif;text-decoration:none}
.go:focus-visible{outline:3px solid var(--creme);outline-offset:3px}
</style>
</head>
<body>
<main>
  <div class="logo">Marché <span>de Gros</span></div>
  <h1>Cette page n’existe pas.</h1>
  <p>Le lien est peut-être incomplet, ou la page a changé d’adresse. Les annonces, les prix et les commandes sont toujours là.</p>
  <a class="go" href="index.html">Revenir à l’accueil</a>
</main>
</body>
</html>
