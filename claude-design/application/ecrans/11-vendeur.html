<!-- ═══ VENDEUR ═══ -->
<div data-pg="vendeur" data-screen-label="Vendeur" onPointerDown="{{ edgeDown }}" onPointerUp="{{ edgeUp }}" style="position:absolute;inset:0;background:var(--papier);color:var(--encre);display:flex;flex-direction:column;transform:{{ tf.vendeur }};visibility:{{ vis.vendeur }};z-index:{{ zi.vendeur }};backface-visibility:hidden;-webkit-backface-visibility:hidden;box-shadow:-24px 0 48px rgba(0,0,0,.3)">
<sc-if value="{{ on.vendeur }}" hint-placeholder-val="{{ false }}">
  <div style="flex:none;padding-top:{{ topPad }};background:var(--nuit-2);color:var(--ivoire)"><div style="display:flex;align-items:center;height:52px;padding:0 8px"><button onClick="{{ back }}" aria-label="Retour" style="width:44px;height:44px;border:0;background:transparent;color:inherit;display:flex;align-items:center;justify-content:center"><svg width="22" height="22" stroke="currentColor" stroke-width="1.8" aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke-linecap="round" stroke-linejoin="round" data-ico="retour"><path d="m15 18-6-6 6-6"></path></svg></button><span class="lab lab-d" style="flex:1;text-align:center">Vendeur</span><span style="width:44px"></span></div>
    <div style="padding:6px 24px 26px;display:flex;flex-direction:column;gap:8px"><span style="font-family:Jost,sans-serif;font-size:34px;font-weight:900;font-style:italic;letter-spacing:-.025em;line-height:1">{{ vd.name }}</span><span style="font-size:var(--t-base);color:var(--sable)">{{ vd.place }}</span><span style="font-size:var(--t-sm);color:var(--mute-d)">{{ vd.agent }}</span>
      <sc-if value="{{ vd.canDm }}" hint-placeholder-val="{{ false }}"><div style="display:flex;gap:8px;margin-top:8px"><button onClick="{{ vd.dm }}" style="flex:1;height:48px;border-radius:24px;border:0;background:var(--action);color:var(--action-t);display:flex;align-items:center;justify-content:center;gap:8px;font-size:var(--t-lead);font-weight:600"><svg width="18" height="18" stroke="currentColor" stroke-width="1.8" aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke-linecap="round" stroke-linejoin="round" data-ico="messages"><path d="M7.9 20A9 9 0 1 0 4 16.1L2 22Z"></path><path d="M8 12h.01"></path><path d="M12 12h.01"></path><path d="M16 12h.01"></path></svg>Écrire au vendeur</button><sc-if value="{{ vd.canVoir }}" hint-placeholder-val="{{ false }}"><button onClick="{{ vd.voir }}" style="flex:1;height:48px;border-radius:24px;border:1px solid rgba(245,240,230,.3);background:transparent;color:var(--ivoire);font-size:var(--t-lead);font-weight:600">Voir son profil</button></sc-if></div></sc-if><sc-if value="{{ vd.mine }}" hint-placeholder-val="{{ false }}"><span style="margin-top:6px;font-size:var(--t-md);color:var(--terre-clair)">C’est vous : voici vos offres telles que les acheteurs les voient.</span></sc-if></div></div>
  <div style="flex:1;overflow-y:auto;padding:20px 18px 40px;display:flex;flex-direction:column;gap:10px">
    <span class="lab">Ses offres</span>
    <sc-for list="{{ vd.offers }}" as="o" hint-placeholder-count="1"><button onClick="{{ o.go }}" style="border:0;background:var(--carte);border-radius:16px;padding:12px 14px;display:flex;gap:12px;align-items:center;text-align:left;color:var(--encre)"><img sc-camel-src="{{ o.img }}" alt="" style="width:56px;height:56px;border-radius:12px;object-fit:{{ o.fit }};flex:none"><span style="flex:1;display:flex;flex-direction:column;gap:3px"><span style="font-weight:600;font-size:var(--t-lead)">{{ o.product }}</span><span style="font-size:var(--t-md);color:var(--texte-2)">{{ o.line }}</span><span class="qd" data-u="{{ o.qU }}">{{ o.qT }}</span><sc-if value="{{ o.hasTr }}" hint-placeholder-val="{{ false }}"><span class="qd" data-u="{{ o.trU }}">{{ o.trT }}</span></sc-if><span style="font-size:var(--t-md);font-weight:600">{{ o.price }}</span></span></button></sc-for>
  </div>
</sc-if>
</div>
