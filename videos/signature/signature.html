<!doctype html>
<html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Signature Marché de Gros</title>
<!-- Signature animée « marché de Gros » / « marché du pays » : même animation que le titre de la connexion (v3/nuage.js).
     Sert à fabriquer les vidéos de ce dossier (voir LISEZMOI.md). ?format=carre (1080 × 1080) ou ?format=large (1920 × 1080). -->
<link rel="stylesheet" href="../../css/fonts.css">
<style>
html,body{margin:0;height:100%;background:#171512}
body{display:grid;place-items:center;overflow:hidden}
.b{display:block;font:600 var(--t)/1.04 Jost,sans-serif;letter-spacing:-.028em;color:#F3EFE4;white-space:nowrap}
.m{display:inline-block;overflow:hidden;vertical-align:bottom;padding:0 .02em .08em;margin:0 -.02em -.08em}.m>span{display:inline-block}
.g{display:inline-block;font-weight:800;font-style:italic;letter-spacing:-.02em;color:#F2C230}
.pile{display:inline-grid;clip-path:inset(-.12em -.3em -.26em -.1em)}.pile>span{grid-area:1/1;display:inline-block}.pile>.y{opacity:0}
.t{display:inline-block;padding:0 .12em .06em .02em;margin:0 -.12em -.06em 0;background:linear-gradient(100deg,#F2C230 0 42%,#FFEDB0 50%,#F2C230 58% 100%) 100% 0/260% 100% no-repeat;-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent}
.on .m>span{animation:M .8s .26s cubic-bezier(.22,1,.36,1) both}
.on .g{animation:G .7s .62s cubic-bezier(.65,0,.35,1) both}.on .x .t{animation:S 1.5s 1.45s cubic-bezier(.4,0,.2,1) both}
.on .x{animation:X 10s cubic-bezier(.65,0,.35,1) infinite}
.on .y{animation:Y 10s cubic-bezier(.65,0,.35,1) infinite}
.on .y .t{animation:R 10s linear infinite}
@keyframes X{0%,30%{transform:none;opacity:1}35%,57%{transform:translateY(-.5em);opacity:0}62%,100%{transform:none;opacity:1}}
@keyframes Y{0%,32%{transform:translateY(.5em);opacity:0}37%,55%{transform:none;opacity:1}60%,100%{transform:translateY(.5em);opacity:0}}
@keyframes R{0%,37%{background-position:100% 0}49%,100%{background-position:0 0}}
@keyframes S{from{background-position:100% 0}to{background-position:0 0}}
@keyframes M{from{transform:translateY(105%)}}
@keyframes G{from{clip-path:inset(-30% 100% -30% -10%);transform:translateX(-6px)}to{clip-path:inset(-30% -10% -30% -10%);transform:none}}
</style></head>
<body><h1 id="s" class="b"><span class="m"><span>marché</span></span> <span class="g"><span class="pile"><span class="x"><span class="t">de Gros</span></span><span class="y" aria-hidden="true"><span class="t">du pays</span></span></span></span></h1>
<script>
  var f = new URLSearchParams(location.search).get('format');
  document.documentElement.style.setProperty('--t', f === 'large' ? '190px' : '118px');
  document.fonts.ready.then(function () { document.getElementById('s').classList.add('on'); });
</script>
</body></html>
