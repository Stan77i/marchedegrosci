<!-- ═══ ACHETER ═══ -->
<div data-pg="acheter" data-screen-label="Acheter" onPointerDown="{{ edgeDown }}" onPointerUp="{{ edgeUp }}" style="position:absolute;inset:0;background:var(--papier);color:var(--encre);display:flex;flex-direction:column;transform:{{ tf.acheter }};visibility:{{ vis.acheter }};z-index:{{ zi.acheter }};backface-visibility:hidden;-webkit-backface-visibility:hidden;box-shadow:-24px 0 48px rgba(0,0,0,.3)">
<sc-if value="{{ on.acheter }}" hint-placeholder-val="{{ false }}">
  <div style="flex:none;padding-top:{{ topPad }};background:var(--papier);border-bottom:1px solid var(--trait-doux)">
    <div style="display:flex;align-items:center;gap:6px;padding:6px 12px 10px 6px">
      <button onClick="{{ back }}" aria-label="Retour" style="width:44px;height:44px;border:0;background:transparent;color:inherit;display:flex;align-items:center;justify-content:center;flex:none"><svg width="22" height="22" stroke="currentColor" stroke-width="1.8" aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke-linecap="round" stroke-linejoin="round" data-ico="retour"><path d="m15 18-6-6 6-6"></path></svg></button>
      <div style="flex:1;display:flex;align-items:center;gap:8px;height:48px;border-radius:24px;background:var(--champ);border:1px solid rgba(23,21,18,.14);padding:0 14px"><svg width="18" height="18" stroke="#847966" stroke-width="1.8" aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke-linecap="round" stroke-linejoin="round" data-ico="chercher"><circle cx="11" cy="11" r="8"></circle><path d="m21 21-4.3-4.3"></path></svg><input ref="{{ aRef }}" value="{{ aq }}" onChange="{{ onAq }}" placeholder="50 sacs de riz à Bouaké" style="flex:1;min-width:0;border:0;background:transparent;font-size:var(--t-lg);outline:none;color:var(--encre)"><sc-if value="{{ aqHas }}" hint-placeholder-val="{{ false }}"><button onClick="{{ clearAq }}" aria-label="Effacer" style="border:0;background:transparent;color:var(--mute);width:28px;height:28px;padding:0"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true" style="display:block;margin:auto"><path d="M18 6 6 18M6 6l12 12"/></svg></button></sc-if></div>
    </div>
    <div style="display:flex;gap:6px;overflow-x:auto;padding:0 16px 12px">
      <button onClick="{{ toggleFilters }}" style="flex:none;height:36px;padding:0 14px;border-radius:18px;border:1px solid {{ fBtn.bd }};background:{{ fBtn.bg }};color:{{ fBtn.color }};font-size:var(--t-md);font-weight:500;display:flex;align-items:center;gap:6px"><svg width="14" height="14" stroke="currentColor" stroke-width="2" aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke-linecap="round" stroke-linejoin="round" data-ico="filtre"><path d="M3 6h18"></path><path d="M7 12h10"></path><path d="M10 18h4"></path></svg>{{ fBtn.l }}</button>
      <button onClick="{{ vfBtn.go }}" aria-pressed="{{ vfBtn.pressed }}" style="flex:none;height:36px;padding:0 12px;border-radius:18px;border:1px solid {{ vfBtn.bd }};background:{{ vfBtn.bg }};color:{{ vfBtn.color }};font-size:var(--t-md);font-weight:500;display:flex;align-items:center;gap:5px;white-space:nowrap"><svg width="15" height="15" viewBox="0 0 24 24" aria-hidden="true"><path fill="#4A8FD6" d="M12 1.6l2.6 1.9 3.2-.2 1 3 2.6 1.9-1 3.1 1 3.1-2.6 1.9-1 3-3.2-.2L12 22.4l-2.6-1.9-3.2.2-1-3-2.6-1.9 1-3.1-1-3.1 2.6-1.9 1-3 3.2.2z"></path><path d="m8 12.2 2.7 2.7L16.2 9.4" fill="none" stroke="#fff" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round"></path></svg>Vérifiés</button>
      <sc-for list="{{ famChips }}" as="c" hint-placeholder-count="6"><button onClick="{{ c.go }}" style="flex:none;height:36px;padding:0 14px;border-radius:18px;border:1px solid {{ c.bd }};background:{{ c.bg }};color:{{ c.color }};font-size:var(--t-md);font-weight:500;white-space:nowrap">{{ c.l }}</button></sc-for>
    </div>
  </div>
  <div style="flex:1;overflow-y:auto;padding:14px 16px 40px;display:flex;flex-direction:column;gap:14px">
    <sc-if value="{{ fOpen }}" hint-placeholder-val="{{ false }}">
      <div style="background:var(--carte);border-radius:18px;padding:16px;display:flex;flex-direction:column;gap:12px;animation:mkFade .3s both">
        <label style="display:flex;flex-direction:column;gap:6px;font-size:var(--t-md);font-weight:500">Région<select aria-label="Région" value="{{ af.reg }}" onChange="{{ afh.reg }}" style="height:48px;border-radius:12px;border:1px solid var(--trait);background:var(--champ);padding:0 10px;font-size:var(--t-lead);color:var(--encre)"><option value="">Toute la Côte d'Ivoire</option><sc-for list="{{ regions }}" as="r" hint-placeholder-count="14"><option value="{{ r.slug }}">{{ r.name }}</option></sc-for></select></label>
        <div style="display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:10px">
          <label style="display:flex;flex-direction:column;gap:6px;font-size:var(--t-md);font-weight:500">Quantité min.<input value="{{ af.qmin }}" onChange="{{ afh.qmin }}" inputmode="numeric" placeholder="—" style="height:48px;border-radius:12px;border:1px solid var(--trait);background:var(--champ);padding:0 12px;font-size:var(--t-lg);color:var(--encre);min-width:0"></label>
          <label style="display:flex;flex-direction:column;gap:6px;font-size:var(--t-md);font-weight:500">Prix max. (F)<input value="{{ af.pmax }}" onChange="{{ afh.pmax }}" inputmode="numeric" placeholder="—" style="height:48px;border-radius:12px;border:1px solid var(--trait);background:var(--champ);padding:0 12px;font-size:var(--t-lg);color:var(--encre);min-width:0"></label>
        </div>
        <button onClick="{{ resetFilters }}" style="align-self:flex-start;border:0;background:transparent;color:var(--rouille);font-size:var(--t-md);font-weight:500;padding:6px 0">Tout effacer</button>
      </div>
    </sc-if>
    <sc-if value="{{ understood.on }}" hint-placeholder-val="{{ false }}">
      <div style="display:flex;flex-wrap:wrap;gap:6px;align-items:center"><span style="font-size:var(--t-sm);color:var(--mute)">Compris :</span><sc-for list="{{ understood.chips }}" as="u" hint-placeholder-count="2"><span style="font-size:var(--t-sm);padding:5px 10px;border-radius:12px;background:var(--lin);color:#2f2b22;display:flex;gap:5px"><b style="font-weight:600">{{ u.k }}</b>{{ u.v }}</span></sc-for></div>
    </sc-if>
    <sc-if value="{{ sugg.on }}" hint-placeholder-val="{{ false }}">
      <div style="display:flex;flex-direction:column;background:var(--carte);border-radius:16px;overflow:hidden">
        <sc-for list="{{ sugg.list }}" as="s" hint-placeholder-count="3"><button onClick="{{ s.go }}" style="border:0;background:transparent;display:flex;align-items:center;gap:12px;padding:8px 14px;min-height:52px;text-align:left;color:var(--encre);border-bottom:1px solid rgba(23,21,18,.06)"><img sc-camel-src="{{ s.thumb }}" alt="" style="width:36px;height:36px;object-fit:{{ s.fit }};border-radius:{{ s.rad }}"><span style="flex:1;display:flex;flex-direction:column"><span style="font-size:var(--t-lead)">{{ s.name }}</span><span style="font-size:var(--t-sm);color:var(--mute)">{{ s.sub }}</span></span><span style="font-size:var(--t-sm);color:var(--rouille)">Fiche</span></button></sc-for>
      </div>
    </sc-if>
    <div role="group" aria-label="Quelles publications" class="aseg" style="display:flex;gap:2px;background:var(--lin);border-radius:22px;padding:3px"><sc-for list="{{ aSeg }}" as="k" hint-placeholder-count="3"><button onClick="{{ k.go }}" aria-pressed="{{ k.on }}" style="flex:1 1 auto;min-width:0;min-height:48px;padding:2px 10px;border:0;border-radius:24px;background:{{ k.bg }};color:{{ k.color }};font-size:var(--t-sm);font-weight:600;line-height:1.15;white-space:nowrap;display:inline-flex;align-items:center;justify-content:center;gap:6px;transition:background-color .3s,color .3s"><i class="{{ k.symC }}" aria-hidden="true" style="display:{{ k.sym }}"></i>{{ k.l }}<span class="nbul {{ k.nC }}">{{ k.n }}</span></button></sc-for></div>
    <div style="display:flex;justify-content:space-between;align-items:center"><span class="lab">{{ aCount }}</span><button onClick="{{ aCarte }}" style="border:0;background:transparent;color:var(--rouille);font-size:var(--t-md);font-weight:500;padding:8px 0;min-height:36px">Sur la carte →</button></div>
    <sc-for list="{{ aList }}" as="o" hint-placeholder-count="0">
          <article class="an" aria-label="{{ o.aria }}"><button class="an-tete" onClick="{{ o.go }}" aria-label="{{ o.goL }}"><img class="an-img" sc-camel-src="{{ o.img }}" alt="" style="object-fit:{{ o.fit }};background:{{ o.imgBg }}"><span class="an-id"><span class="an-l1"><span class="an-nom">{{ o.product }}</span><span class="an-quand">{{ o.ago }}</span></span><span class="an-qui"><i class="an-forme od {{ o.mkC }}" aria-hidden="true">{{ o.emo }}</i><sc-if value="{{ o.hasAv }}" hint-placeholder-val="{{ false }}"><img sc-camel-src="{{ o.av }}" alt=""></sc-if><b>{{ o.who }}</b><sc-if value="{{ o.idOk }}" hint-placeholder-val="{{ false }}"><span class="idv-badge" role="img" aria-label="Identité vérifiée" title="Identité vérifiée"><svg width="15" height="15" viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" d="M12 1.6l2.6 1.9 3.2-.2 1 3 2.6 1.9-1 3.1 1 3.1-2.6 1.9-1 3-3.2-.2L12 22.4l-2.6-1.9-3.2.2-1-3-2.6-1.9 1-3.1-1-3.1 2.6-1.9 1-3 3.2.2z"></path><path d="m8 12.2 2.7 2.7L16.2 9.4" fill="none" stroke="#fff" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round"></path></svg></span></sc-if>{{ o.st }}<sc-if value="{{ o.hasNote }}" hint-placeholder-val="{{ false }}"><span>· ★ {{ o.note }}</span></sc-if><span>· {{ o.ou }}</span></span>{{ o.stru }}</span></button><div class="an-chiffres"><div><small>{{ o.qLab }}</small><b>{{ o.qTxt }} <em>{{ o.unitQ }}</em></b></div><div><small>{{ o.pLab }}</small><sc-if value="{{ o.hasP }}" hint-placeholder-val="{{ true }}"><b>{{ o.pTxt }} <em>F / {{ o.unit }}</em></b></sc-if><sc-if value="{{ o.noP }}" hint-placeholder-val="{{ false }}"><b class="doux">À discuter</b></sc-if></div></div><div class="an-infos"><span class="qd" data-u="{{ o.qU }}">{{ o.qT }}</span><sc-if value="{{ o.hasTr }}" hint-placeholder-val="{{ false }}"><span class="qd" data-u="{{ o.trU }}">{{ o.trT }}</span></sc-if><sc-for list="{{ o.infos }}" as="c" hint-placeholder-count="2"><span style="background:{{ c.bg }};color:{{ c.fg }}">{{ c.t }}</span></sc-for></div><sc-if value="{{ o.hasSig }}" hint-placeholder-val="{{ false }}"><div class="an-alerte"><svg width="16" height="16" stroke="currentColor" stroke-width="1.8" aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke-linecap="round" stroke-linejoin="round" data-ico="signaler"><path d="M4 15s1-1 4-1 5 2 8 2 4-1 4-1V3s-1 1-4 1-5-2-8-2-4 1-4 1z"></path><line x1="4" x2="4" y1="22" y2="15"></line></svg>{{ o.sigTxt }}</div></sc-if><sc-if value="{{ o.mine }}" hint-placeholder-val="{{ false }}"><div class="an-moi"><i></i>C’est votre annonce : les autres membres vous écrivent ici.</div></sc-if><sc-if value="{{ o.hasActs }}" hint-placeholder-val="{{ true }}"><div class="an-actions"><sc-if value="{{ o.canDm }}" hint-placeholder-val="{{ false }}"><button class="an-act plein" onClick="{{ o.dm }}"><svg width="17" height="17" stroke="currentColor" stroke-width="1.8" aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke-linecap="round" stroke-linejoin="round" data-ico="messages"><path d="M7.9 20A9 9 0 1 0 4 16.1L2 22Z"></path><path d="M8 12h.01"></path><path d="M12 12h.01"></path><path d="M16 12h.01"></path></svg>Écrire</button></sc-if><sc-if value="{{ o.canNeg }}" hint-placeholder-val="{{ false }}"><button class="an-act trait" onClick="{{ o.neg }}"><svg width="17" height="17" aria-hidden="true" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24" fill="none" stroke-linecap="round" stroke-linejoin="round" data-ico="negoce"><path d="m11 17 2 2a1 1 0 1 0 3-3"></path><path d="m14 14 2.5 2.5a1 1 0 1 0 3-3l-3.88-3.88a3 3 0 0 0-4.24 0l-.88.88a1 1 0 1 1-3-3l2.81-2.81a5.79 5.79 0 0 1 7.06-.87l.47.28a2 2 0 0 0 1.42.25L21 4"></path><path d="m21 3 1 11h-2"></path><path d="M3 3 2 14l6.5 6.5a1 1 0 1 0 3-3"></path><path d="M3 4h8"></path></svg>{{ o.negL }}</button></sc-if><sc-if value="{{ o.canGrp }}" hint-placeholder-val="{{ false }}"><button class="an-grp" onClick="{{ o.grp }}"><svg width="16" height="16" aria-hidden="true" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24" fill="none" stroke-linecap="round" stroke-linejoin="round"><circle cx="9" cy="8" r="3"/><circle cx="17" cy="9" r="2.5"/><path d="M3 20c0-3.3 2.7-6 6-6s6 2.7 6 6"/><path d="M15 14.5c.6-.3 1.3-.5 2-.5 2.5 0 4 2 4 4.5"/></svg>{{ o.grpL }}</button></sc-if><sc-if value="{{ o.canRep }}" hint-placeholder-val="{{ false }}"><button class="an-sig" onClick="{{ o.rep }}" aria-label="Signaler cette annonce" title="Signaler"><svg width="16" height="16" stroke="currentColor" stroke-width="1.8" aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke-linecap="round" stroke-linejoin="round" data-ico="signaler"><path d="M4 15s1-1 4-1 5 2 8 2 4-1 4-1V3s-1 1-4 1-5-2-8-2-4 1-4 1z"></path><line x1="4" x2="4" y1="22" y2="15"></line></svg></button></sc-if></div></sc-if></article>
        </sc-for>
    <sc-if value="{{ aEmpty }}" hint-placeholder-val="{{ true }}">
      <div style="border:1px dashed rgba(23,21,18,.22);border-radius:18px;padding:20px;display:flex;flex-direction:column;gap:12px;align-items:flex-start"><div style="align-self:center">{{ sacVidePetit }}</div><span style="font-size:var(--t-lg);font-weight:500">{{ aEmptyT }}</span><span style="font-size:var(--t-base);color:var(--texte-3);line-height:1.5;text-wrap:pretty">{{ aEmptyX }}</span><button onClick="{{ aDemande }}" style="height:46px;padding:0 20px;border-radius:23px;border:0;background:var(--action);color:var(--action-t);font-weight:600;font-size:var(--t-base);display:flex;align-items:center;gap:8px"><span style="width:9px;height:9px;border-radius:2px;background:var(--encre)"></span>{{ aDemandeL }}</button></div>
    </sc-if>
  </div>
</sc-if>
</div>
