<!-- ═══ INFO (comment ça marche, aide producteur, confiance) ═══ -->
<div data-pg="info" data-screen-label="Comprendre" onPointerDown="{{ edgeDown }}" onPointerUp="{{ edgeUp }}" style="position:absolute;inset:0;background:var(--encre);color:var(--ivoire);display:flex;flex-direction:column;transform:{{ tf.info }};visibility:{{ vis.info }};z-index:{{ zi.info }};backface-visibility:hidden;-webkit-backface-visibility:hidden;box-shadow:-24px 0 48px rgba(0,0,0,.4)">
<sc-if value="{{ on.info }}" hint-placeholder-val="{{ false }}">
  <div style="flex:none;padding-top:{{ topPad }}"><div style="display:flex;align-items:center;height:52px;padding:0 8px"><button onClick="{{ back }}" aria-label="Retour" style="width:44px;height:44px;border:0;background:transparent;color:var(--ivoire);display:flex;align-items:center;justify-content:center"><svg width="22" height="22" stroke="currentColor" stroke-width="1.8" aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke-linecap="round" stroke-linejoin="round" data-ico="retour"><path d="m15 18-6-6 6-6"></path></svg></button><span style="flex:1;text-align:center;font-size:var(--t-lead);font-weight:600">{{ info.title }}</span><span style="width:44px"></span></div></div>
  <div style="flex:1;overflow-y:auto;padding:20px 22px 40px;display:flex;flex-direction:column;gap:26px">
    <div style="font-size:29px;line-height:1.08" class="voix">{{ info.lead }}</div>
    <sc-for list="{{ info.steps }}" as="s" hint-placeholder-count="3">
      <div style="display:flex;gap:16px;align-items:flex-start;animation:mkFade .5s both">
        {{ s.ico }}
        <span style="display:flex;flex-direction:column;gap:4px;padding-top:4px"><span style="font-size:13px;color:#D6A83E;font-weight:600">{{ s.n }}</span><span style="font-size:var(--t-xl);font-weight:500">{{ s.t }}</span><span style="font-size:var(--t-base);color:var(--sable);line-height:1.5">{{ s.x }}</span></span>
      </div>
    </sc-for>
    <button onClick="{{ info.go }}" style="flex:none;height:56px;border-radius:28px;border:0;background:var(--action);color:var(--action-t);font-size:var(--t-lg);font-weight:600;margin-top:8px">{{ info.cta }}</button>
  </div>
</sc-if>
</div>

</div>
