<!-- ═══ TOUS LES PRODUITS (bouton « Tout voir » de la roue) : grille de 3 ou 4 colonnes, recherche, familles, offres et demandes en direct ═══ -->
<div class="tv" role="dialog" aria-modal="true" aria-label="Tous les produits" aria-hidden="{{ toutCache }}" style="transform:{{ toutTf }};transition:{{ sheetTr }}">
  <div onPointerDown="{{ sDown }}" onPointerMove="{{ sMove }}" onPointerUp="{{ sUp }}" onPointerCancel="{{ sUp }}" onLostPointerCapture="{{ sUp }}" class="tv-poignee"><span></span></div>
  <div class="tv-tete"><div class="voix tv-titre"><span>Tous les <em>produits</em></span><small>{{ toutSous }}</small></div><button onClick="{{ closeAll }}" class="tv-x" aria-label="Fermer"><svg width="16" height="16" stroke="currentColor" stroke-width="2" aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke-linecap="round"><path d="M18 6 6 18"></path><path d="m6 6 12 12"></path></svg></button></div>
  <label class="tv-cherche"><svg width="18" height="18" stroke="currentColor" stroke-width="1.8" aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke-linecap="round"><circle cx="11" cy="11" r="7"></circle><path d="m20 20-3.5-3.5"></path></svg><input type="search" value="{{ tq }}" onChange="{{ tqh }}" placeholder="Chercher : tomate, igname, poulet…" aria-label="Chercher un produit" enterkeyhint="search"><sc-if value="{{ tqOn }}" hint-placeholder-val="{{ false }}"><button type="button" onClick="{{ tqVide }}" aria-label="Effacer" class="tv-eff"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true" style="display:block;margin:auto"><path d="M18 6 6 18M6 6l12 12"/></svg></button></sc-if></label>
  <div class="tv-fams" role="group" aria-label="Familles"><sc-for list="{{ toutFams }}" as="c" hint-placeholder-count="6"><button type="button" aria-pressed="{{ c.on }}" onClick="{{ c.go }}"><sc-if value="{{ c.vif }}" hint-placeholder-val="{{ false }}"><i></i></sc-if>{{ c.t }}<b>{{ c.n }}</b></button></sc-for></div>
  <div class="tv-corps">
    <sc-for list="{{ toutSecs }}" as="g" hint-placeholder-count="0"><section class="tv-sec"><sc-if value="{{ g.titreOn }}" hint-placeholder-val="{{ false }}"><h3>{{ g.t }}<span class="nbul">{{ g.n }}</span></h3></sc-if><div class="tv-grille">
      <sc-for list="{{ g.items }}" as="p" hint-placeholder-count="0"><div class="tv-case"><button type="button" class="tv-p" aria-current="{{ p.ici }}" onClick="{{ p.go }}" aria-label="{{ p.lab }}"><span class="tv-img"><img sc-camel-src="{{ p.img }}" alt="" loading="lazy" decoding="async" style="object-fit:{{ p.fit }};border-radius:{{ p.rad }}"></span><span class="tv-n">{{ p.name }}</span><sc-if value="{{ p.vif }}" hint-placeholder-val="{{ false }}"><span class="tv-c"><sc-if value="{{ p.hasO }}" hint-placeholder-val="{{ false }}"><span class="o"><i></i>{{ p.o }}</span></sc-if><sc-if value="{{ p.hasD }}" hint-placeholder-val="{{ false }}"><span class="d"><i></i>{{ p.d }}</span></sc-if></span></sc-if></button><button type="button" class="tv-plus" onClick="{{ p.plus }}" aria-label="{{ p.plusL }}" aria-expanded="{{ p.plusX }}"><svg width="16" height="16" viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"><path d="M12 5v14"></path><path d="M5 12h14"></path></svg></button><sc-if value="{{ p.plusOn }}" hint-placeholder-val="{{ false }}"><div class="tv-choix" role="group" aria-label="{{ p.choixL }}"><button type="button" class="o" onClick="{{ p.jai }}"><i class="od od-o" aria-hidden="true"></i><span><b>J’ai</b><small>à vendre</small></span></button><button type="button" class="d" onClick="{{ p.cherche }}"><i class="od od-d" aria-hidden="true"></i><span><b>Je cherche</b><small>à acheter</small></span></button></div></sc-if></div></sc-for>
    </div></section></sc-for>
    <sc-if value="{{ toutVide }}" hint-placeholder-val="{{ false }}"><p class="tv-vide">{{ toutVideTxt }}</p></sc-if>
    <div style="height:{{ botPad }}"></div>
  </div>
</div>
