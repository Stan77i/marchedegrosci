<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>Tableau de bord · Marché de Gros</title>
<meta name="theme-color" content="#10392B">
<link rel="icon" type="image/svg+xml" href="icons/v2/favicon.svg">
<link rel="stylesheet" href="css/fonts.css?v=20261023f">
<link rel="stylesheet" href="css/symboles.css?v=20261102d">
<style>
/* Tableau de bord aux couleurs du logo : vert profond, maïs, crème. Une seule police : Jost. */
:root{--bg:#0B2219;--panel:#10392B;--panel2:#144533;--champ:#0A1E16;--photo:#06150F;--ink:#F3EFE4;--mute:#B7C2B6;--faint:#8C9B8F;--line:rgba(243,239,228,.09);--line2:rgba(243,239,228,.16);
  --acc:#F2C230;--acc-t:#10392B;--v:#6CC58C;--a:#F2C230;--ok:#9CC9F2;--bad:#E5604F;--bad-t:#F4A397;--sur:#10392B}
*{box-sizing:border-box}
html,body{font-variant-numeric:lining-nums tabular-nums;margin:0;background:var(--bg);color:var(--ink);font:400 15px/1.5 Jost,system-ui,sans-serif;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
a{color:inherit}
:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
.serif{font-family:Jost,system-ui,sans-serif;font-weight:600}
/* cadre : menu à gauche sur ordinateur, en haut (onglets qui défilent) sur téléphone */
.app{display:grid;grid-template-columns:248px minmax(0,1fr);min-height:100dvh;background:linear-gradient(90deg,var(--panel) 248px,var(--bg) 248px)}
.rail{position:sticky;top:0;height:100dvh;display:flex;flex-direction:column;gap:2px;padding:22px 14px 16px;background:var(--panel);z-index:20}
.brand{display:flex;flex-direction:column;align-items:flex-start;gap:10px;padding:2px 10px 22px;text-decoration:none}
.brand svg{flex:none;max-width:100%}
.badge-off{display:inline-flex;align-items:center;gap:6px;height:24px;padding:0 10px 0 8px;border-radius:999px;background:var(--acc);color:var(--acc-t);font:600 12px/1 Jost,sans-serif;letter-spacing:.02em;white-space:nowrap}
.badge-off svg{width:13px;height:13px}
.navs{display:flex;flex-direction:column;gap:2px}
.nav{display:flex;align-items:center;gap:12px;min-height:44px;padding:0 12px;border:0;border-radius:12px;background:none;color:var(--mute);font-weight:500;font-size:15px;text-align:left;text-decoration:none;cursor:pointer;white-space:nowrap}
.nav:hover{color:var(--ink);background:rgba(243,239,228,.06)}
.nav[aria-current=page]{color:var(--acc-t);background:var(--ink)}
.nav svg{flex:none;width:19px;height:19px}
.nav em{margin-left:auto;min-width:22px;height:22px;padding:0 7px;border-radius:11px;background:var(--acc);color:var(--acc-t);font:600 12px/22px Jost,sans-serif;font-style:normal;text-align:center}
.nav[aria-current=page] em{background:var(--panel);color:var(--ink)}
.rail .sp{flex:1}
.nav.retour{display:none}
.rail .who{margin:8px 0 0;padding:12px;border-top:1px solid var(--line);color:var(--faint);font-size:12.5px;line-height:1.45}.rail .who b{display:block;color:var(--mute);font-weight:500;font-size:13.5px}
main{min-width:0;max-width:1180px;padding:34px clamp(16px,4vw,48px) 96px}
/* titre de page */
.top{display:flex;flex-wrap:wrap;align-items:flex-start;justify-content:space-between;gap:12px 24px;margin:0 0 26px}
.top h1{margin:0;font:600 clamp(26px,3.4vw,32px)/1.1 Jost,sans-serif;letter-spacing:-.01em}
.top p{margin:6px 0 0;max-width:68ch;color:var(--mute);font-size:14.5px}
.top .outils{display:flex;gap:8px;flex-wrap:wrap;margin-left:auto}
/* boutons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:42px;padding:0 18px;border:1px solid var(--line2);border-radius:999px;background:none;font-weight:600;font-size:14px;cursor:pointer;text-decoration:none;white-space:nowrap;transition:background .15s}
.btn:hover{background:rgba(243,239,228,.07)}
.btn.pri{background:var(--ink);border-color:var(--ink);color:var(--sur)}.btn.pri:hover{background:#fff}
.btn.bad{color:var(--bad-t);border-color:rgba(229,96,79,.45)}.btn.bad:hover{background:rgba(229,96,79,.12)}
.btn.sm{min-height:34px;padding:0 13px;font-size:13px}.btn[disabled]{opacity:.5;cursor:default}
.btn.ghost{border-color:transparent;color:var(--mute)}.btn.ghost:hover{color:var(--ink)}
/* lecture incomplète : une ligne discrète, dépliable */
.err{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin:-10px 0 22px;padding:6px 6px 6px 14px;border-radius:14px;background:rgba(242,194,48,.08);color:var(--mute);font-size:13.5px}
.err details{flex:1;min-width:200px}.err summary{cursor:pointer;list-style:none;display:flex;align-items:center;gap:8px;min-height:34px}.err summary::-webkit-details-marker{display:none}
.err summary::before{content:'';flex:none;width:8px;height:8px;border-radius:50%;background:var(--acc)}
.err summary u{text-decoration:none;color:var(--faint);font-size:12.5px}
.err ul{margin:4px 0 8px;padding:0 0 0 16px;color:var(--faint);font-size:12.5px;word-break:break-word}
/* aperçu : les chiffres-clés */
.tuiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:12px;margin:0 0 28px}
.tuile{display:flex;flex-direction:column;gap:6px;padding:18px 18px 16px;border-radius:20px;background:var(--panel);text-decoration:none;min-width:0}
.tuile b{font:600 36px/1 Jost,sans-serif;letter-spacing:-.02em}
.tuile span{color:var(--mute);font-size:13.5px;line-height:1.35}
a.tuile:hover{background:var(--panel2)}
.tuile.alert{background:var(--acc);color:var(--acc-t)}.tuile.alert span{color:rgba(16,57,43,.8)}a.tuile.alert:hover{background:#F5CD52}
/* pouls */
.pouls{padding:22px 24px 20px;border-radius:24px;background:var(--panel);margin:0 0 32px}
.pouls h2{margin:0 0 2px;font:600 19px/1.2 Jost,sans-serif}.pouls .sub{margin:0 0 18px;color:var(--mute);font-size:13.5px}
.days{display:grid;grid-template-columns:repeat(14,minmax(0,1fr));gap:6px;align-items:end;height:150px}
.day{display:flex;flex-direction:column-reverse;align-items:center;gap:3px;height:100%;position:relative}
.day i{display:block;flex:none;width:10px;height:10px}.day i.o{border-radius:50%;background:var(--v)}.day i.d{border-radius:2px;background:var(--a);width:9px;height:9px}
.day .bar{width:12px;border-radius:6px 6px 2px 2px;background:linear-gradient(var(--a) var(--dp),var(--v) var(--dp))}
.day .n{font-size:11px;color:var(--mute)}
.day small{position:absolute;bottom:-20px;font-size:10.5px;color:var(--faint)}
.day.today small{color:var(--ink);font-weight:600}
.leg{display:flex;flex-wrap:wrap;gap:6px 16px;margin:30px 0 0;font-size:12.5px;color:var(--mute)}.leg span{display:inline-flex;align-items:center;gap:6px}
.leg i{display:inline-block;width:10px;height:10px}.leg i.o{border-radius:50%;background:var(--v)}.leg i.d{border-radius:2px;background:var(--a)}
/* sections */
.sec{margin:0 0 34px}
.sec-h{display:flex;flex-wrap:wrap;align-items:baseline;justify-content:space-between;gap:6px 16px;margin:0 0 12px}
.sec-h h2{margin:0;font:600 19px/1.25 Jost,sans-serif}.sec-h p{flex-basis:100%;margin:0;max-width:72ch;color:var(--mute);font-size:13.5px}
.tools{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin:0 0 14px}
.seg{display:inline-flex;padding:3px;border-radius:999px;background:var(--panel)}
.seg button{min-height:36px;padding:0 14px;border:0;border-radius:999px;background:none;color:var(--mute);font-weight:600;font-size:13.5px;cursor:pointer}.seg button[aria-pressed=true]{background:var(--ink);color:var(--sur)}
.search{flex:1;min-width:180px;height:42px;padding:0 16px;border:1px solid var(--line2);border-radius:999px;background:var(--champ);color:var(--ink)}
.search::placeholder{color:var(--faint)}
/* listes */
.list{border-radius:20px;overflow:hidden;background:var(--panel)}
.row{display:grid;grid-template-columns:20px minmax(0,2.2fr) minmax(0,1.2fr) minmax(0,1fr) auto;gap:4px 18px;align-items:center;padding:15px 20px;border-top:1px solid var(--line)}
.row:first-child{border-top:0}
.row:hover{background:rgba(243,239,228,.025)}
.row .mk{width:12px;height:12px}.mk.o{border-radius:50%;background:var(--v)}.mk.d{border-radius:3px;background:var(--a)}.mk.r{background:var(--bad)}.mk.off{background:none!important;border:2px solid var(--faint)}
.row b{display:block;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.row small{display:block;color:var(--mute);font-size:13px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.row .acts{display:flex;gap:6px;justify-content:flex-end;flex-wrap:wrap}
.row.is-hidden{opacity:.62}
.tag{display:inline-block;padding:2px 9px;border-radius:999px;font-size:12px;font-weight:600;background:rgba(243,239,228,.08);color:var(--mute);vertical-align:1px}
.tag.bad{background:rgba(229,96,79,.16);color:var(--bad-t)}.tag.ok{background:rgba(156,201,242,.15);color:#B9DAF6}.tag.acc{background:rgba(242,194,48,.16);color:var(--acc)}
.motifs{grid-column:2 / -1;display:flex;flex-wrap:wrap;gap:6px;margin-top:4px}
.motifs span{padding:3px 10px;border-radius:10px;background:var(--champ);color:var(--mute);font-size:12.5px}
.empty{padding:36px 20px;text-align:center;color:var(--mute);font-size:14px}.empty b{display:block;margin:0 0 4px;font:600 17px/1.3 Jost,sans-serif;color:var(--ink)}
.more{display:block;width:100%;min-height:50px;border:0;border-top:1px solid var(--line);background:none;color:var(--mute);font-weight:600;cursor:pointer}.more:hover{color:var(--ink)}
.carte{padding:16px 18px;display:flex;flex-direction:column;gap:12px}
.carte textarea{width:100%;padding:14px 16px;border:1px solid var(--line2);border-radius:16px;background:var(--champ);color:var(--ink);font:400 15px/1.45 Jost,sans-serif;resize:vertical}
.note{color:var(--faint);font-size:13px;max-width:72ch}
.fil.idx div{max-width:none;padding:0;background:none;border-radius:0;font-size:14.5px}
.fil.idx .idx-ph{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px}
.idx-ph figure{margin:0;display:flex;flex-direction:column;gap:6px}
.idx-ph figcaption{color:var(--mute);font-size:12.5px}
.idx-ph img{display:block;width:100%;max-height:340px;object-fit:contain;border-radius:12px;background:var(--photo)}
.fil.idx .idx-info{display:flex;flex-direction:column;gap:10px;padding-top:4px}
.idx-info p{margin:0}.idx-code{font-size:22px;letter-spacing:.12em}
.fil.idx .acts{display:flex;flex-wrap:wrap;gap:8px}
/* porte d'entrée */
.gate{display:grid;place-items:center;min-height:100dvh;padding:24px 16px}
.gate .card{max-width:420px;width:100%;padding:34px 26px 26px;border-radius:28px;background:var(--panel);text-align:center}
.gate .card > svg{display:block;margin:0 auto}
.gate h1{margin:20px 0 8px;font:600 26px/1.15 Jost,sans-serif}.gate p{margin:0 0 22px;color:var(--mute)}
.gate .btn.pri{min-width:200px;min-height:48px;font-size:15px}
/* fil en lecture */
.fil{display:flex;flex-direction:column;gap:8px;padding:14px 20px 20px;border-top:1px solid var(--line);background:var(--champ)}
.fil div{max-width:80%;padding:8px 12px;border-radius:14px;background:rgba(243,239,228,.07);font-size:14px}.fil div.p{align-self:flex-end;background:rgba(108,197,140,.14)}.fil div em{display:block;font-style:normal;color:var(--mute);font-size:12px}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);z-index:50;max-width:min(92vw,440px);padding:12px 18px;border-radius:16px;background:var(--ink);color:var(--sur);font-weight:600;font-size:14px;box-shadow:0 12px 40px rgba(0,0,0,.35);transition:opacity .3s}
@media (max-width:900px){
  .app{grid-template-columns:minmax(0,1fr);background:var(--bg)}.rail{min-width:0}
  .rail{position:sticky;top:0;height:auto;gap:0;padding:calc(12px + env(safe-area-inset-top)) 0 0;box-shadow:0 8px 24px rgba(0,0,0,.2)}
  .brand{flex-direction:row;align-items:center;justify-content:space-between;padding:0 16px 10px}
  .brand svg{height:20px;width:auto}
  .navs{flex-direction:row;overflow-x:auto;gap:4px;padding:0 12px 10px;scrollbar-width:none;-webkit-overflow-scrolling:touch;scroll-snap-type:x proximity}
  .navs::-webkit-scrollbar{display:none}
  .nav{flex:none;min-height:38px;padding:0 14px;gap:8px;font-size:14px;border-radius:999px;scroll-snap-align:start}
  .nav svg{width:17px;height:17px}
  .nav em{margin-left:2px;min-width:20px;height:20px;line-height:20px;font-size:11.5px}
  .rail .sp,.rail .who,.nav.ext{display:none}
  .nav.retour{display:inline-flex;color:var(--acc,#F2C230);box-shadow:0 0 0 1.5px rgba(242,194,48,.55) inset;padding:0 14px 0 8px;gap:4px}
  main{padding:22px 16px 80px}
  .top{margin-bottom:20px}.top .outils .btn{min-height:36px;padding:0 14px;font-size:13px}
  .tuiles{grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
  .tuile{padding:14px 14px 13px;border-radius:18px}.tuile b{font-size:30px}.tuile span{font-size:12.5px}
  .pouls{padding:18px 16px 16px;border-radius:20px}.days{height:110px;gap:4px}
  .row{grid-template-columns:16px minmax(0,1fr) auto;padding:14px 16px}.row .c3,.row .c4{grid-column:2;}.row .acts{grid-column:2 / -1;justify-content:flex-start;margin-top:6px}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>
<div id="root"><div class="gate"><div class="card"><p>Chargement…</p></div></div></div>

<script src="app/icones.js?v=20261025a"></script>
<script src="app/marque.js?v=20261023v"></script>
<script src="v3/messages.js?v=20261124vs1"></script>

<script src="v3/admin-mesures.js?v=20261102a"></script>
<script src="v3/admin-fiabilite.js?v=20261124f1"></script>
<script src="v3/admin-niveaux.js?v=20261124n1"></script>
<script src="v3/admin.js?v=20261124f1"></script>

</body>
