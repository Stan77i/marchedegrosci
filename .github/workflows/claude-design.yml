# Refait le dossier claude-design/ (copies pour Claude Design) quand l'application, le site ou le design changent.
# Gratuit (dépôt public). Demande du propriétaire du 23/10/2026.
# Ne refait pas les captures (elles changent un peu à chaque passage) : Claude Code les refait avec
# `node tools/claude-design-captures.js` après un changement visible. N'enregistre un commit que si un fichier a changé.
name: Dossier Claude Design
on:
  push:
    branches: [main]
    paths:
      - 'application.dc.html'
      - 'css/**'
      - 'app/*.js'
      - 'v3/*.js'
      - 'v3/*.css'
      - 'site/*.css'
      - 'site/*.js'
      - 'tools/site/**'
      - 'DESIGN.md'
      - 'PRODUCT.md'
      - 'tools/claude-design.py'
      - 'tools/claude-design/**'
      - '.github/workflows/claude-design.yml'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: claude-design
  cancel-in-progress: false
jobs:
  copier:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Refaire le dossier
        run: python3 tools/claude-design.py
      - name: Enregistrer s'il a changé
        run: |
          if [ -n "$(git status --porcelain claude-design)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add claude-design
            git commit -m "Dossier Claude Design mis à jour automatiquement"
            git pull --rebase origin main
            git push origin HEAD:main
          else
            echo "Rien n'a changé."
          fi
